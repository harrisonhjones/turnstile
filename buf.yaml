version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  # The Decision enum uses spec-mandated values (ALLOWED = 0, not
  # DECISION_UNSPECIFIED = 0) to match the wire contract in SPEC.md, so the
  # zero-value and prefix rules are disabled for it.
  except:
    - ENUM_ZERO_VALUE_SUFFIX
    - ENUM_VALUE_PREFIX
    - PACKAGE_DIRECTORY_MATCH
breaking:
  use:
    - FILE
