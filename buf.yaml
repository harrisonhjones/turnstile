version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  # The Decision enum uses fixed wire values (ALLOWED = 0, not
  # DECISION_UNSPECIFIED = 0) as part of the turnstile.v1 contract, so the
  # zero-value and prefix rules are disabled for it.
  except:
    - ENUM_ZERO_VALUE_SUFFIX
    - ENUM_VALUE_PREFIX
    - PACKAGE_DIRECTORY_MATCH
breaking:
  use:
    - FILE
