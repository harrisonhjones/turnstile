name: Release

# Two ways to cut a release:
#   1. Push to main — the next SemVer is derived from the Conventional Commit
#      messages since the last tag (feat -> minor, fix/perf/etc. -> patch, a `!`
#      or `BREAKING CHANGE` -> major); a warranted bump is tagged automatically.
#   2. Push a tag `vX.Y.Z` — releases that exact tag. Used to seed the very first
#      release (the auto-bump needs a pre-existing tag as its baseline) or to cut
#      a release deliberately.
# Either way the release is: cross-platform binaries + checksums + changelog via
# GoReleaser (a GitHub Release), then a multi-arch image pushed to Docker Hub.
# GoReleaser runs BEFORE the image push so a failed release never leaves images
# (including the mutable :latest) without a matching GitHub Release.
#
# Requires two repo secrets for the Docker Hub push:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#
# Actions are pinned to a commit SHA (with a version comment) for supply-chain
# safety; bump the SHA and comment together when upgrading.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create tags and the GitHub Release

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: harrisonhjones/turnstile

jobs:
  release:
    # Don't run on a tag/branch deletion push (e.g. removing an orphaned tag).
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history + tags for version calc and changelog

      # Branch push: compute the next version from Conventional Commits. Skipped
      # on a tag push (the tag already names the version).
      - name: Determine next version
        id: tag
        if: github.ref_type != 'tag'
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          # Deliberately the default GITHUB_TOKEN: tags it pushes do NOT re-trigger
          # workflows, which is exactly what stops the `tags:` trigger from cutting
          # a second release. Swapping in a PAT or deploy key here would make this
          # workflow recurse and double-release — don't, without adding a guard.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          # Patch is the catch-all: feat -> minor, `!`/BREAKING -> major, and
          # anything else (fix/refactor/perf/docs/chore/ci/…) -> patch. So every
          # push to main cuts at least a patch release.
          default_bump: patch

      # Resolve the tag/version to release: the pushed tag, the freshly computed
      # one, or — on a retried run — a tag a previous failed run already created at
      # HEAD (github-tag-action then reports no new commits, so new_tag is empty).
      # Reusing it makes "Re-run failed jobs" resume the release instead of silently
      # skipping the version. `tag` stays empty when no bump is warranted.
      # Values are read from env (never interpolated into the script body) so a
      # crafted tag name can't inject shell.
      - name: Resolve release tag
        id: rel
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          elif [ -n "$NEW_TAG" ]; then
            tag="$NEW_TAG"
          else
            tag="$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n1)"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # github-tag-action creates the tag on the remote via the API, so it isn't
      # in the local checkout. Fetch it so GoReleaser can resolve it to HEAD
      # (otherwise: "git tag vX was not made against commit …").
      - name: Fetch the release tag
        if: steps.rel.outputs.tag
        run: git fetch origin --force --tags

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.rel.outputs.tag
        with:
          go-version-file: go.mod
          cache: true

      # Does the GitHub Release already exist? (A retried run after a
      # post-GoReleaser failure must not re-run GoReleaser.)
      - name: Check for existing release
        id: exists
        if: steps.rel.outputs.tag
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Build the management console so GoReleaser's `go build` embeds the real
      # UI (mirrors the Dockerfile's Node stage). Without this the release
      # binaries ship the "run mage build:ui" placeholder page. Same guard as
      # GoReleaser so it only runs when a new release is actually being cut.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.rel.outputs.tag && steps.exists.outputs.exists != 'true'
        with:
          node-version: 22
      - name: Build UI for the release binaries
        if: steps.rel.outputs.tag && steps.exists.outputs.exists != 'true'
        run: |
          npm --prefix internal/management/ui ci
          npm --prefix internal/management/ui run build
          # Vite empties dist/ on build, deleting the tracked .gitkeep; recreate
          # it so the tree stays clean (GoReleaser refuses to run on a dirty git
          # state). The built assets under dist/ are gitignored.
          touch internal/management/ui/dist/.gitkeep

      # Create the GitHub Release FIRST (binaries + checksums + changelog).
      - name: Run GoReleaser
        if: steps.rel.outputs.tag && steps.exists.outputs.exists != 'true'
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.rel.outputs.tag }}

      # Then build and publish the container image.
      - name: Set up QEMU
        if: steps.rel.outputs.tag
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        if: steps.rel.outputs.tag
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        if: steps.rel.outputs.tag
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Decide which image tags to push. The immutable :X.Y.Z is always pushed
      # (safe to re-push on a retry). :latest is added only when this tag is the
      # highest released version AND not a prerelease — so re-running an older
      # run, or pushing a vX.Y.Z-rc.N tag, can't move :latest backward or onto a
      # prerelease. Values are read from env, never interpolated into the script.
      - name: Compute image tags
        id: imgtags
        if: steps.rel.outputs.tag
        env:
          VERSION: ${{ steps.rel.outputs.version }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          latest="$(git tag --list 'v*' | sort -V | tail -n1)"
          tags="${IMAGE}:${VERSION}"
          case "$TAG" in
            *-*) prerelease=yes ;;
            *)   prerelease=no ;;
          esac
          if [ "$TAG" = "$latest" ] && [ "$prerelease" = no ]; then
            tags="${tags}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "$tags"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        if: steps.rel.outputs.tag
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.rel.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.rel.outputs.date }}
          tags: ${{ steps.imgtags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cosmetic README sync — must not fail the release, and runs last.
      - name: Update Docker Hub description
        if: steps.rel.outputs.tag
        continue-on-error: true
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          readme-filepath: ./DOCKERHUB.md
