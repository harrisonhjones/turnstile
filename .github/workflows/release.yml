name: Release

# On every push to main, derive the next SemVer from the Conventional Commit
# messages since the last tag (feat -> minor, fix/perf/etc. -> patch, a `!` or
# `BREAKING CHANGE` -> major) and, when a bump is warranted, tag it and cut a
# release: cross-platform binaries + checksums + changelog via GoReleaser (a
# GitHub Release), and a multi-arch container image pushed to Docker Hub.
# Commits that don't warrant a bump (docs/chore/etc. only) produce no tag and
# the release steps are skipped.
#
# Requires two repo secrets for the Docker Hub push:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create tags and the GitHub Release

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: harrisonhjones/turnstile

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for version calc and changelog

      - name: Determine next version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: false # no conventional feat/fix/breaking -> no release

      - uses: actions/setup-go@v5
        if: steps.tag.outputs.new_tag
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up QEMU
        if: steps.tag.outputs.new_tag
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.tag.outputs.new_tag
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.tag.outputs.new_tag
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        if: steps.tag.outputs.new_tag
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.tag.outputs.new_version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.new_version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        if: steps.tag.outputs.new_tag
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          readme-filepath: ./DOCKERHUB.md

      - name: Run GoReleaser
        if: steps.tag.outputs.new_tag
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.new_tag }}
