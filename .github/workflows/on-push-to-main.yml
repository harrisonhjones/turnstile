name: on-push-to-main

# Cuts a release two ways:
#   1. Push to main — the next SemVer is derived from the Conventional Commit
#      messages since the last tag (feat -> minor, `!`/BREAKING -> major,
#      everything else -> patch); every push cuts at least a patch.
#   2. Push a tag `vX.Y.Z` — releases that exact tag (used to seed the first
#      release, or to cut one deliberately).
# The release is: cross-platform binaries + checksums + changelog via GoReleaser
# (a GitHub Release), then a multi-arch image pushed to Docker Hub. GoReleaser
# runs BEFORE the image push so a failed release never leaves images (including
# the mutable :latest) without a matching GitHub Release. The image build COPYs
# GoReleaser's already-cross-compiled binary (BIN_MODE=prebuilt) rather than
# recompiling in-image.
#
# Requires two repo secrets for the Docker Hub push:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#
# Actions are pinned to a commit SHA (with a version comment); bump both together.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create tags and the GitHub Release

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: harrisonhjones/turnstile

jobs:
  # Gate: the release won't start unless gofmt/vet/build/test pass on this commit.
  # Fast (~30s) and blocking — the same reusable workflow the PR check uses, so a
  # direct push that breaks tests can't ship.
  build-test:
    if: ${{ !github.event.deleted }} # don't run on tag/branch deletions
    uses: ./.github/workflows/build-test.yml

  release:
    needs: build-test
    if: ${{ !github.event.deleted }} # don't run on tag/branch deletions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history + tags for version calc and changelog

      # Branch push: compute the next version from Conventional Commits. Skipped
      # on a tag push (the tag names the version) and on workflow_dispatch (a
      # manual re-run reuses HEAD's existing tag via the fallback below, so it
      # replays a release idempotently instead of inventing a new version each
      # click).
      - name: Determine next version
        id: tag
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          # Deliberately the default GITHUB_TOKEN: tags it pushes do NOT re-trigger
          # workflows, which is exactly what stops the `tags:` trigger from cutting
          # a second release. Swapping in a PAT or deploy key here would make this
          # workflow recurse and double-release — don't, without adding a guard.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          # Patch is the catch-all: feat -> minor, `!`/BREAKING -> major, and
          # anything else (fix/refactor/perf/docs/chore/ci/…) -> patch. So every
          # push to main cuts at least a patch release.
          default_bump: patch

      # Resolve the tag/version to release: the pushed tag, the freshly computed
      # one, or — on a retried/dispatched run — a tag a previous run already
      # created at HEAD (github-tag-action then reports no new commits, so new_tag
      # is empty). Reusing it makes "Re-run failed jobs" and workflow_dispatch
      # resume the release instead of skipping the version. `tag` stays empty when
      # no bump is warranted. Values are read from env (never interpolated into
      # the script body) so a crafted tag name can't inject shell.
      - name: Resolve release tag
        id: rel
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          elif [ -n "$NEW_TAG" ]; then
            tag="$NEW_TAG"
          else
            tag="$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n1)"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # github-tag-action creates the tag on the remote via the API, so it isn't
      # in the local checkout. Fetch it so GoReleaser can resolve it to HEAD
      # (otherwise: "git tag vX was not made against commit …").
      - name: Fetch the release tag
        if: steps.rel.outputs.tag
        run: git fetch origin --force --tags

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.rel.outputs.tag
        with:
          go-version-file: go.mod
          cache: true

      # Does the GitHub Release already exist? (A retried run after a
      # post-GoReleaser failure must not re-publish it — see --skip=publish below.)
      - name: Check for existing release
        id: exists
        if: steps.rel.outputs.tag
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Build the management console so GoReleaser's `go build` embeds the real UI
      # (mirrors the Dockerfile's ui stage). Guarded on `tag` — the same condition
      # as GoReleaser — NOT on the exists guard: GoReleaser runs on every retry to
      # repopulate dist/ for the prebuilt image, and that binary must carry the
      # real UI, so the UI has to be rebuilt on retries too.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.rel.outputs.tag
        with:
          node-version: 22
      - name: Build UI for the release binaries
        if: steps.rel.outputs.tag
        run: |
          npm --prefix internal/management/ui ci
          npm --prefix internal/management/ui run build
          # Vite empties dist/ on build, deleting the tracked .gitkeep; recreate
          # it so the tree stays clean (GoReleaser refuses to run on a dirty git
          # state). The built assets under dist/ are gitignored.
          touch internal/management/ui/dist/.gitkeep

      # Create the GitHub Release (binaries + checksums + changelog) and populate
      # dist/ for the image build below. Runs whenever a tag exists; on a retry
      # where the Release already exists, --skip=publish rebuilds dist/ WITHOUT
      # re-uploading — preserving the release-first + idempotent-retry story.
      - name: Run GoReleaser
        if: steps.rel.outputs.tag
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --clean ${{ steps.exists.outputs.exists == 'true' && '--skip=publish' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.rel.outputs.tag }}

      # No QEMU: every Dockerfile stage used by the prebuilt path is either
      # $BUILDPLATFORM-pinned (runs natively) or COPY-only, so nothing foreign-arch
      # executes at build time. Add docker/setup-qemu-action back if a stage ever
      # gains a target-platform RUN (else the arm64 leg fails "exec format error").
      - name: Set up Buildx
        if: steps.rel.outputs.tag
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        if: steps.rel.outputs.tag
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Always push the immutable :X.Y.Z (retry-safe). Add :latest only when this
      # tag is the highest released version AND not a prerelease, so re-running an
      # older run or pushing a vX.Y.Z-rc.N tag can't move :latest backward/onto a
      # prerelease. Values are read from env, never interpolated into the script.
      - name: Compute image tags
        id: imgtags
        if: steps.rel.outputs.tag
        env:
          VERSION: ${{ steps.rel.outputs.version }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          # grep -v -- '-' drops prereleases: GNU `sort -V` ranks vX.Y.Z-rc.1 ABOVE
          # vX.Y.Z, so without this a stable release cut while a matching prerelease
          # tag exists would leave :latest stranded on the older image.
          latest="$(git tag --list 'v*' | grep -v -- '-' | sort -V | tail -n1)"
          tags="${IMAGE}:${VERSION}"
          case "$TAG" in *-*) pre=yes ;; *) pre=no ;; esac
          if [ "$TAG" = "$latest" ] && [ "$pre" = no ]; then
            tags="${tags}"$'\n'"${IMAGE}:latest"
          fi
          { echo "tags<<EOF"; printf '%s\n' "$tags"; echo EOF; } >> "$GITHUB_OUTPUT"

      # Build and push the image, COPYing GoReleaser's cross-compiled binary from
      # dist/ (BIN_MODE=prebuilt) instead of recompiling in-image.
      - name: Build and push image
        if: steps.rel.outputs.tag
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BIN_MODE=prebuilt
            VERSION=${{ steps.rel.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.rel.outputs.date }}
          tags: ${{ steps.imgtags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cosmetic README sync — must not fail the release, and runs last.
      - name: Update Docker Hub description
        if: steps.rel.outputs.tag
        continue-on-error: true
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          readme-filepath: ./DOCKERHUB.md
