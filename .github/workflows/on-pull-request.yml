name: on-pull-request

# Runs on every pull request: the reusable build-test gate, plus release-path
# validation. The PR is the only place release-validate *gates* (the release
# workflow doesn't run on PRs), so it catches a broken Dockerfile/GoReleaser
# config before merge. Route Docker/release-config changes through a PR.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    uses: ./.github/workflows/build-test.yml

  # Validate the release path without publishing (no tag/push/secrets).
  release-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          install-only: true

      - name: Validate GoReleaser config
        run: goreleaser check

      - name: Build binaries (snapshot; populates dist/ for the image check)
        run: goreleaser build --snapshot --clean

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Build the prebuilt multi-arch image path against the snapshot dist/ — this
      # validates the COPY glob and manifest assembly. No push/load: the result is
      # discarded, we only care that it succeeds. (The compile mode is the
      # local-dev fallback; its per-arch compile is intentionally not exercised
      # here — the release uses prebuilt.)
      - name: Validate prebuilt image build
        run: |
          docker buildx build --build-arg BIN_MODE=prebuilt \
            --platform linux/amd64,linux/arm64 .
