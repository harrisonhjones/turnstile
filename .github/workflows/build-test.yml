name: build-test

# Reusable quality gate: gofmt, vet, build, and race tests. Defined once and
# called (via `uses:`) by both on-pull-request.yml and on-push-to-main.yml, so
# the PR check and the release gate can never drift apart.
on:
  workflow_call: # reusable only; not triggered directly

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # gofmt over the Go sources (the generated stubs are gofmt-clean too).
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test -race ./...
